<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skotaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  :root {
    --bg: #e6ede8; --surface: #ffffff; --ink: #26302c;
    --sky: #c6e2ec; --sky2: #e1f0f2; --cloud: #ffffff;
    --far: #a3c2ba; --mid: #74a286; --grass: #67a046; --dirt: #8a6a48; --dirt2: #6c5136;
    --veil: rgba(255, 255, 255, 0.86); --night: 0; --machine: #c8322b;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111714; --surface: #1a221e; --ink: #e3ebe6;
      --sky: #132134; --sky2: #1b2d40; --cloud: #2a3b50;
      --far: #22384a; --mid: #22443a; --grass: #2f5c34; --dirt: #4b3b2b; --dirt2: #392c1f;
      --veil: rgba(17, 23, 20, 0.88); --night: 1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111714; --surface: #1a221e; --ink: #e3ebe6;
    --sky: #132134; --sky2: #1b2d40; --cloud: #2a3b50;
    --far: #22384a; --mid: #22443a; --grass: #2f5c34; --dirt: #4b3b2b; --dirt2: #392c1f;
    --veil: rgba(17, 23, 20, 0.88); --night: 1;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Silkscreen", ui-monospace, "Courier New", monospace;
    display: flex; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 1040px; padding: 1.75rem 1rem 2.5rem; }
  h1 { font-weight: 400; font-size: clamp(2rem, 7vw, 3.4rem); margin: 0 0 0.25rem; line-height: 1; }
  .lead { margin: 0 0 1.1rem; font-size: 0.85rem; opacity: 0.75; line-height: 1.6; }

  .stage { position: relative; container-type: inline-size; border: 4px solid var(--ink); background: var(--sky); }
  canvas#c {
    display: block; width: 100%; aspect-ratio: 480 / 270;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(5px, 1.8cqw, 18px);
    background: var(--veil); text-align: center; padding: 6px;
  }
  .overlay[hidden] { display: none; }
  .ov-title { margin: 0; font-size: clamp(16px, 5cqw, 40px); line-height: 1; }
  .ov-text { margin: 0; font-size: clamp(10px, 2cqw, 16px); opacity: 0.85; max-width: 46ch; line-height: 1.5; }
  .stars { font-size: clamp(18px, 5cqw, 40px); letter-spacing: 0.15em; color: #e0a020; line-height: 1; }
  .row { display: flex; gap: clamp(6px, 2cqw, 20px); align-items: center; justify-content: center; }

  button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--machine);
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button:active, button.pressed { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--machine); }
  button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  .ov-btn { font-size: clamp(10px, 2.2cqw, 18px); padding: clamp(5px, 1.2cqw, 12px) clamp(10px, 2.4cqw, 22px); }
  .ov-btn.primary { background: var(--machine); color: #fff; border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .ov-btn.primary:active { box-shadow: 0 0 0 var(--ink); }
  .small-btn { font-size: clamp(10px, 2cqw, 16px); padding: clamp(3px, 0.8cqw, 8px) clamp(8px, 1.6cqw, 14px); box-shadow: 3px 3px 0 var(--ink); }
  .level-label { font-size: clamp(11px, 2.4cqw, 20px); min-width: 9ch; }
  .level-label .s { color: #e0a020; }

  .pick {
    padding: clamp(4px, 1cqw, 10px);
    display: flex; flex-direction: column; align-items: center; gap: clamp(2px, 0.6cqw, 6px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .pick canvas {
    width: clamp(56px, 16cqw, 160px); aspect-ratio: 92 / 62;
    image-rendering: pixelated; image-rendering: crisp-edges; background: var(--sky);
  }
  .pick span { font-size: clamp(9px, 2cqw, 16px); }
  .pick[aria-pressed="true"] { border-color: var(--pick-color); box-shadow: 4px 4px 0 var(--pick-color); }
  @container (max-width: 520px) { .hide-small { display: none; } }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.9rem; }
  .controls button { font-size: 1.1rem; padding: 1.1rem 0.5rem; }
  .controls small { display: block; font-size: 0.65rem; opacity: 0.6; margin-top: 0.2rem; }
  @media (hover: none) { .controls small { display: none; } }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; gap: 1rem; flex-wrap: wrap; }
  .help { font-size: 0.75rem; line-height: 1.8; opacity: 0.7; max-width: 64ch; margin: 0; }
  #btnSound { font-size: 0.8rem; padding: 0.4rem 0.8rem; box-shadow: 3px 3px 0 var(--ink); }
  .err { padding: 2rem; font-size: 0.9rem; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>Skotaren</h1>
  <p class="lead">Kör timret från hygget till avlägget utan att tappa lasten.</p>

  <div class="stage">
    <canvas id="c" width="480" height="270" aria-label="Spelplan"></canvas>

    <div class="overlay" id="menu">
      <p class="ov-title">Skotaren</p>
      <div class="row">
        <button class="pick" type="button" data-m="komatsu" style="--pick-color:#c8322b">
          <canvas width="92" height="62"></canvas><span>Komatsu</span>
        </button>
        <button class="pick" type="button" data-m="deere" style="--pick-color:#3b7d34">
          <canvas width="92" height="62"></canvas><span>John Deere</span>
        </button>
      </div>
      <div class="row">
        <button class="small-btn" type="button" id="lvPrev" aria-label="Föregående bana">◀</button>
        <span class="level-label" id="lvLabel">Bana 1</span>
        <button class="small-btn" type="button" id="lvNext" aria-label="Nästa bana">▶</button>
      </div>
      <button class="ov-btn primary" type="button" id="btnStart">Kör</button>
    </div>

    <div class="overlay" id="result" hidden>
      <p class="ov-title" id="resTitle">Framme!</p>
      <div class="stars" id="resStars">★★★</div>
      <p class="ov-text" id="resText"></p>
      <div class="row">
        <button class="ov-btn" type="button" id="btnRetry">Kör igen</button>
        <button class="ov-btn primary" type="button" id="btnNext">Nästa bana</button>
        <button class="ov-btn hide-small" type="button" id="btnMenu">Meny</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btnBrake" type="button">◀ Broms<small>← eller A</small></button>
    <button id="btnGas" type="button">Gas ▶<small>→ eller D</small></button>
  </div>

  <div class="bar">
    <p class="help">Gasa uppför och bromsa nerför. I luften kan du luta maskinen med gas och broms. Tappar du mer än 60 % av stockarna klarar du inte banan. R startar om, Esc går till menyn.</p>
    <button id="btnSound" type="button">Ljud: på</button>
  </div>
</main>

<script>
(() => {
  if (!window.Matter) {
    document.querySelector(".stage").innerHTML = '<p class="err">Fysikmotorn kunde inte laddas. Kontrollera internetanslutningen och ladda om sidan.</p>';
    return;
  }
  const { Engine, Bodies, Body, Composite, Constraint } = Matter;

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const W = 480, H = 270, Z = 0.5, SEG = 40, BASE_Y = 600;
  const STEP = 1000 / 60;

  const MACHINES = {
    komatsu: { b: "#c8322b", d: "#86201b" },
    deere:   { b: "#3b7d34", d: "#23501e" },
  };
  const C = {
    tire: "#222624", rim: "#8d908c", steel: "#3a3f3c", bar: "#6b716d", glass: "#bfe6f3",
    skin: "#f1c39b", helmet: "#f08a24", shirt: "#2f5fa0", light: "#ffd35a",
    bark: "#8a5a32", bark2: "#a06a3c", wood: "#e2c08f", ring: "#b07a45",
    g: "#3f8f4a", G: "#2a6334", t: "#7a5232", stone: "#8d908c", stone2: "#b4b7b2",
  };

  // ---------- Lagring ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  let machine = store.get("skotaren-maskin", "komatsu");
  if (!MACHINES[machine]) machine = "komatsu";
  let progress = store.get("skotaren-progress", { unlocked: 1, stars: {} });
  if (!progress || typeof progress.unlocked !== "number") progress = { unlocked: 1, stars: {} };
  let level = Math.min(progress.unlocked, store.get("skotaren-bana", 1)) || 1;
  let soundOn = store.get("skotaren-ljud", true);

  // ---------- Färger från CSS ----------
  let col = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["ink", "sky", "sky2", "cloud", "far", "mid", "grass", "dirt", "dirt2"]) col[k] = cs.getPropertyValue("--" + k).trim();
    col.night = cs.getPropertyValue("--night").trim() === "1";
    drawPreviews();
  }

  // ---------- Hjälpfunktioner för ritning ----------
  function R(c, x0, y0, x1, y1, color) { c.fillStyle = color; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
  function circle(c, x, y, r, color) { c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }

  const TREE = [
    "....G....", "...GgG...", "..GgggG..", "...GgG...", "..GgggG..", ".GgggggG.",
    "...GgG...", "..GgggG..", ".GgggggG.", "GgggggggG", "....t....", "....t....",
  ];
  function drawTree(c, x, groundY, s) {
    const w = 9 * s, h = TREE.length * s;
    for (let r = 0; r < TREE.length; r++) for (let i = 0; i < 9; i++) {
      const ch = TREE[r][i];
      if (ch === ".") continue;
      c.fillStyle = C[ch];
      c.fillRect(x - w / 2 + i * s, groundY - h + r * s + 2, s + 0.6, s + 0.6);
    }
  }

  // Skotaren ritas i egna koordinater där chassits mitt är (0,0)
  const WHEELS = [-62, -28, 34, 66];
  const WHEEL_Y = 26, WHEEL_R = 16;
  function drawForwarder(c, m) {
    R(c, 30, -66, 38, -10, m.d);                       // kranpelare
    R(c, -80, -10, 80, 10, m.b);                       // chassi
    R(c, -80, 4, 80, 10, m.d);
    R(c, 40, -50, 78, -10, m.b);                       // hytt
    R(c, 38, -54, 80, -48, m.d);
    R(c, 45, -45, 74, -24, C.glass);
    R(c, 55, -43, 63, -38, C.helmet);                  // föraren
    R(c, 56, -38, 63, -33, C.skin);
    R(c, 54, -33, 64, -24, C.shirt);
    R(c, 70, -64, 74, -54, C.steel);                   // avgasrör
    R(c, 78, -22, 82, -16, C.light);
    R(c, 22, -70, 30, -10, C.steel);                   // lastgrind
    for (let y = -64; y < -14; y += 10) R(c, 23, y, 29, y + 3, C.bar);
    R(c, -27, -60, -23, -10, C.steel);                 // stakar
    R(c, -80, -60, -74, -10, C.steel);
  }
  function drawBoom(c, m) {
    c.lineCap = "square";
    c.strokeStyle = m.b; c.lineWidth = 7;
    c.beginPath(); c.moveTo(34, -66); c.lineTo(-18, -82); c.stroke();
    c.strokeStyle = m.d; c.lineWidth = 5;
    c.beginPath(); c.moveTo(-18, -82); c.lineTo(-36, -76); c.stroke();
    R(c, -40, -76, -32, -66, C.steel);
  }
  function drawWheel(c, x, y, ang) {
    circle(c, x, y, WHEEL_R, C.tire);
    circle(c, x, y, WHEEL_R * 0.55, C.rim);
    c.save(); c.translate(x, y); c.rotate(ang);
    R(c, -WHEEL_R * 0.5, -2, WHEEL_R * 0.5, 2, C.tire);
    R(c, -2, -WHEEL_R * 0.5, 2, WHEEL_R * 0.5, C.tire);
    c.restore();
  }
  function drawBogies(c, w) {
    c.strokeStyle = C.steel; c.lineWidth = 6; c.lineCap = "round";
    c.beginPath(); c.moveTo(w[0].x, w[0].y); c.lineTo(w[1].x, w[1].y); c.stroke();
    c.beginPath(); c.moveTo(w[2].x, w[2].y); c.lineTo(w[3].x, w[3].y); c.stroke();
  }
  function drawLog(c, x, y, ang) {
    c.save(); c.translate(x, y); c.rotate(ang);
    R(c, -20, -6, 20, 6, C.bark);
    R(c, -20, -6, 20, -4, C.bark2);
    R(c, -20, 4, 20, 6, "#6b4426");
    R(c, -8, -2, 2, -1, "#6b4426"); R(c, 6, 1, 14, 2, "#6b4426");
    R(c, -21, -5, -17, 5, C.wood);
    R(c, -20, -1, -18, 1, C.ring);
    c.restore();
  }

  // ---------- Förhandsvisningar ----------
  const picks = [...document.querySelectorAll(".pick")];
  function drawPreviews() {
    for (const p of picks) {
      const c = p.querySelector("canvas").getContext("2d");
      const m = MACHINES[p.dataset.m];
      R(c, 0, 0, 92, 62, col.sky || "#c6e2ec");
      R(c, 0, 59, 92, 60, col.grass || "#67a046");
      R(c, 0, 60, 92, 62, col.dirt || "#8a6a48");
      c.save(); c.translate(46, 41); c.scale(0.46, 0.46);
      const w = WHEELS.map(x => ({ x, y: WHEEL_Y }));
      drawBogies(c, w);
      drawForwarder(c, m);
      for (let row = 0; row < 4; row++) { drawLog(c, -50, -16 - row * 12, 0); drawLog(c, 0, -16 - row * 12, 0); }
      drawBoom(c, m);
      for (const q of w) drawWheel(c, q.x, q.y, 0.4);
      c.restore();
    }
  }
  function setMachine(m) {
    machine = m;
    store.set("skotaren-maskin", m);
    document.documentElement.style.setProperty("--machine", MACHINES[m].b);
    for (const p of picks) p.setAttribute("aria-pressed", String(p.dataset.m === m));
  }

  // ---------- Ljud ----------
  let audio = null, engOsc = null, engGain = null;
  function ensureAudio() {
    if (audio || !soundOn) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      engOsc = audio.createOscillator(); engOsc.type = "sawtooth"; engOsc.frequency.value = 50;
      const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
      engGain = audio.createGain(); engGain.gain.value = 0;
      engOsc.connect(f).connect(engGain).connect(audio.destination);
      engOsc.start();
    } catch (e) { audio = null; }
  }
  function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (!soundOn) return;
    ensureAudio();
    if (!audio) return;
    try {
      const t = audio.currentTime;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function engineSound(rev, on) {
    if (!audio || !engGain) return;
    const t = audio.currentTime;
    engGain.gain.setTargetAtTime(on && soundOn ? 0.035 : 0, t, 0.08);
    engOsc.frequency.setTargetAtTime(42 + rev * 260, t, 0.1);
  }

  // ---------- Bana ----------
  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const smooth = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };

  let G = null; // spelvärlden
  function buildLevel(lvl) {
    const rand = rng(lvl * 9973 + 7);
    const d = Math.min(lvl, 6);
    const L = Math.min(2800 + 900 * (lvl - 1), 8000);
    const A1 = 40 + 12 * d, A2 = 10 + 5 * d, A3 = 2 + 1.5 * d;
    const p1 = rand() * 6.28, p2 = rand() * 6.28, p3 = rand() * 6.28;
    const xF = L - 300;
    const yAt = x => {
      const ramp = smooth((x - 350) / 400) * smooth((L - 480 - x) / 400);
      return BASE_Y - ramp * (A1 * Math.sin(x / 330 + p1) + A2 * Math.sin(x / 165 + p2) + A3 * Math.sin(x / 62 + p3));
    };
    const pts = [];
    for (let x = -480; x <= L + 680; x += SEG) pts.push({ x, y: yAt(x) });

    const engine = Engine.create();
    engine.gravity.y = 1;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    const statics = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const len = Math.hypot(b.x - a.x, b.y - a.y) + 4, T = 60;
      const cx = (a.x + b.x) / 2 - Math.sin(ang) * T / 2, cy = (a.y + b.y) / 2 + Math.cos(ang) * T / 2;
      statics.push(Bodies.rectangle(cx, cy, len, T, { isStatic: true, angle: ang, friction: 1, frictionStatic: 2, label: "ground" }));
    }
    statics.push(Bodies.rectangle(-460, BASE_Y - 400, 40, 1000, { isStatic: true }));
    statics.push(Bodies.rectangle(L + 660, BASE_Y - 400, 40, 1000, { isStatic: true }));

    const groundY = x => {
      const i = Math.max(0, Math.min(pts.length - 2, Math.floor((x + 480) / SEG)));
      const a = pts[i], b = pts[i + 1];
      return a.y + (b.y - a.y) * ((x - a.x) / SEG);
    };
    const slopeAt = x => Math.atan2(groundY(x + 6) - groundY(x - 6), 12);

    // stubbar och stenar
    const bumps = [];
    if (lvl >= 2) {
      let x = 800;
      while (x < L - 800) {
        const kind = (lvl >= 3 && rand() < 0.45) ? "rock" : "stump";
        const gy = groundY(x);
        if (Math.abs(slopeAt(x)) > 0.28) { x += 60; continue; }
        let body;
        if (kind === "stump") body = Bodies.rectangle(x, gy, 22, 16, { isStatic: true, angle: slopeAt(x), friction: 0.9, chamfer: { radius: [5, 5, 0, 0] }, collisionFilter: { category: 4, mask: 1 } });
        else body = Bodies.circle(x, gy + 10, 15, { isStatic: true, friction: 0.9, collisionFilter: { category: 4, mask: 1 } });
        bumps.push({ kind, body, x, y: body.position.y, ang: slopeAt(x) });
        statics.push(body);
        x += lvl >= 4 ? 380 + rand() * 520 : 600 + rand() * 600;
      }
    }

    // dekorgranar
    const decor = [];
    for (let x = -400; x < L + 600; x += 90 + rand() * 200) {
      if (Math.abs(x - xF) < 160 || Math.abs(x - (xF + 140)) < 120) continue;
      decor.push({ x, s: 5 + Math.floor(rand() * 4), shade: rand() < 0.5 });
    }

    // skotaren
    const x0 = 160, y0 = groundY(160) - 48;
    const group = Body.nextGroup(true);
    const filt = { group, category: 2, mask: 1 };
    const base = Bodies.rectangle(x0, y0, 160, 20, { density: 0.004, collisionFilter: filt });
    const parts = [
      base,
      Bodies.rectangle(x0 + 59, y0 - 30, 38, 40, { density: 0.002, collisionFilter: filt }),
      Bodies.rectangle(x0 + 26, y0 - 40, 8, 60, { density: 0.002, collisionFilter: filt }),
      Bodies.rectangle(x0 - 25, y0 - 35, 4, 50, { density: 0.002, collisionFilter: filt }),
      Bodies.rectangle(x0 - 77, y0 - 35, 6, 50, { density: 0.002, collisionFilter: filt }),
    ];
    const chassis = Body.create({ parts, collisionFilter: filt, friction: 0.6 });
    const wheels = [], cons = [];
    for (const wx of WHEELS) {
      const w = Bodies.circle(x0 + wx, y0 + WHEEL_Y, WHEEL_R, { density: 0.003, friction: 1, frictionStatic: 3, restitution: 0, collisionFilter: { group, category: 1, mask: 0xFFFF } });
      wheels.push(w);
      cons.push(Constraint.create({
        bodyA: chassis, pointA: { x: x0 + wx - chassis.position.x, y: y0 + WHEEL_Y - chassis.position.y },
        bodyB: w, pointB: { x: 0, y: 0 }, length: 0, stiffness: 0.6, damping: 0.12,
      }));
    }

    // timmer
    const rows = lvl >= 3 ? 5 : 4;
    const logs = [];
    for (let r = 0; r < rows; r++) for (const lx of [-50.5, -0.5]) {
      logs.push(Bodies.rectangle(x0 + lx, y0 - 16.5 - r * 12.2, 40, 12, {
        density: 0.0015, friction: 0.8, frictionStatic: 1.2, restitution: 0, chamfer: { radius: 2 },
      }));
    }

    Composite.add(engine.world, [...statics, chassis, ...wheels, ...cons, ...logs]);
    return { engine, pts, groundY, L, xF, chassis, base, wheels, logs, bumps, decor, total: logs.length,
             camX: x0 + 120, camY: y0 - 40, time: 0, flipT: 0, delivered: 0, lost: 0, settle: 0.6 };
  }

  // ---------- Spellogik ----------
  const menu = document.getElementById("menu");
  const result = document.getElementById("result");
  let state = "menu"; // menu | run | done | fail
  let doneT = 0;
  const input = { gas: false, brake: false };

  function logsOnLoad() {
    const b = G.base, a = G.chassis.angle, ca = Math.cos(-a), sa = Math.sin(-a);
    let n = 0;
    for (const l of G.logs) {
      const dx = l.position.x - b.position.x, dy = l.position.y - b.position.y;
      const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      if (lx > -84 && lx < 32 && ly < 0 && ly > -110) n++;
    }
    return n;
  }

  function startLevel() {
    ensureAudio();
    G = buildLevel(level);
    store.set("skotaren-bana", level);
    state = "run";
    menu.hidden = true; result.hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    G.lastLoad = G.total;
    beep(660, 0.08); setTimeout(() => beep(880, 0.08), 90);
  }
  function showMenu() {
    state = "menu";
    result.hidden = true; menu.hidden = false;
    if (!G) G = buildLevel(level);
    updateLevelLabel();
    engineSound(0, false);
  }
  function starsFor(n, total) {
    const f = n / total;
    return f >= 1 ? 3 : f >= 0.75 ? 2 : f >= 0.4 ? 1 : 0;
  }
  function finish(ok) {
    engineSound(0, false);
    const resTitle = document.getElementById("resTitle");
    const resStars = document.getElementById("resStars");
    const resText = document.getElementById("resText");
    const btnNext = document.getElementById("btnNext");
    const t = fmtTime(G.time);
    if (!ok) {
      resTitle.textContent = "Skotaren välte!";
      resStars.textContent = "☆☆☆";
      resText.textContent = "Ta det lite lugnare i backarna och försök igen.";
      btnNext.disabled = level >= progress.unlocked;
    } else {
      const n = G.delivered, st = starsFor(n, G.total);
      resStars.textContent = "★".repeat(st) + "☆".repeat(3 - st);
      if (st === 0) {
        resTitle.textContent = "För lite last";
        resText.textContent = `Du levererade ${n} av ${G.total} stockar. Du behöver minst 40 % av lasten för att klara banan.`;
      } else {
        resTitle.textContent = st === 3 ? "Perfekt leverans!" : "Framme!";
        resText.textContent = `Du levererade ${n} av ${G.total} stockar på ${t} och tjänade ${n * 100} kr.`;
        const prev = progress.stars[level] || 0;
        if (st > prev) progress.stars[level] = st;
        if (level >= progress.unlocked) progress.unlocked = level + 1;
        store.set("skotaren-progress", progress);
        beep(784, 0.1); setTimeout(() => beep(988, 0.1), 110); setTimeout(() => beep(1318, 0.16), 230);
      }
      btnNext.disabled = level + 1 > progress.unlocked;
    }
    result.hidden = false;
    (btnNext.disabled ? document.getElementById("btnRetry") : btnNext).focus({ preventScroll: true });
  }

  const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function physicsStep() {
    const dt = STEP / 1000;
    const ch = G.chassis;
    let grounded = 0;
    for (const w of G.wheels) if (w.position.y + WHEEL_R > G.groundY(w.position.x) - 5) grounded++;

    if (state === "run") {
      G.time += dt;
      for (const w of G.wheels) {
        const av = w.angularVelocity;
        if (input.gas && !input.brake) Body.setAngularVelocity(w, Math.min(av + 0.03, 0.34));
        else if (input.brake && !input.gas) Body.setAngularVelocity(w, av > 0.02 ? av - 0.05 : Math.max(av - 0.015, -0.2));
        else Body.setAngularVelocity(w, av * 0.985);
      }
      // motorns dragkraft hjälper maskinen över hinder och uppför backar
      if (grounded >= 2) {
        const ca = Math.cos(ch.angle), sa = Math.sin(ch.angle);
        const fwd = ch.velocity.x * ca + ch.velocity.y * sa;
        let f = 0;
        if (input.gas && !input.brake && fwd < 5.5) f = 0.0009;
        if (input.brake && !input.gas && fwd < 0.5 && fwd > -3) f = -0.0005;
        if (f) Body.applyForce(ch, ch.position, { x: ca * f * ch.mass, y: sa * f * ch.mass });
      }
      if (grounded === 0) {
        if (input.gas) Body.setAngularVelocity(ch, ch.angularVelocity - 0.0022);
        if (input.brake) Body.setAngularVelocity(ch, ch.angularVelocity + 0.0022);
      }
    } else {
      for (const w of G.wheels) Body.setAngularVelocity(w, w.angularVelocity * 0.9);
    }

    Engine.update(G.engine, STEP);

    if (state === "run") {
      const a = Math.atan2(Math.sin(ch.angle), Math.cos(ch.angle));
      G.flipT = Math.abs(a) > 1.75 ? G.flipT + dt : 0;
      if (G.flipT > 1.0 || G.base.position.y > G.groundY(G.base.position.x) + 400) {
        state = "fail"; doneT = 0; beep(160, 0.4, "square", 0.06, -100);
      }
      if (G.settle > 0) G.settle -= dt;
      const load = logsOnLoad();
      if (G.settle <= 0 && load < G.lastLoad) beep(110, 0.2, "triangle", 0.08, -40);
      if (G.settle <= 0) G.lastLoad = load;
      if (G.base.position.x > G.xF) {
        G.delivered = load; state = "done"; doneT = 0;
      }
    }
  }

  // ---------- Ritning ----------
  function drawBackground() {
    R(ctx, 0, 0, W, H, col.sky);
    const horizon = H * 0.62 - (G.camY - BASE_Y) * Z * 0.15;
    R(ctx, 0, horizon - 60, W, H, col.sky2);
    if (col.night) {
      ctx.fillStyle = "#e9eef5";
      for (let i = 0; i < 45; i++) {
        if ((i + Math.floor(performance.now() / 700)) % 9 === 0) continue;
        ctx.fillRect((i * 173) % W, (i * 61) % 120 + 4, 2, 2);
      }
    }
    const sx = W - 70, sy = 40;
    circle(ctx, sx, sy, 15, col.night ? "#ece8cf" : "#ffd35a");
    if (col.night) circle(ctx, sx - 7, sy - 4, 13, col.sky);
    ctx.fillStyle = col.cloud;
    for (let i = 0; i < 4; i++) {
      const x = (((i * 170 + 60) - G.camX * Z * 0.05) % (W + 120) + W + 120) % (W + 120) - 60;
      const y = 22 + (i % 2) * 22;
      ctx.fillRect(Math.round(x), y, 40, 6); ctx.fillRect(Math.round(x + 8), y - 6, 20, 6);
    }
    ctx.fillStyle = col.far;
    for (let x = 0; x < W; x += 2) {
      const wx = x + G.camX * Z * 0.15;
      const k = Math.floor(wx / 2) % 6, tip = (k < 3 ? k : 6 - k) * 2;
      const h = Math.round(34 + 12 * Math.sin(wx / 70) + 6 * Math.sin(wx / 23)) + tip;
      ctx.fillRect(x, horizon - h, 2, H);
    }
    ctx.fillStyle = col.mid;
    const off = (G.camX * Z * 0.35) % 26, base = Math.floor(G.camX * Z * 0.35 / 26);
    for (let i = -1; i < W / 26 + 2; i++) {
      const bx = i * 26 - off;
      const hash = ((i + base) * 2654435761) >>> 0;
      const h = 18 + (hash % 4) * 6;
      for (let r = 0; r < h; r += 2) {
        const w = Math.max(2, Math.round((r / h) * 14 / 2) * 2);
        ctx.fillRect(Math.round(bx - w / 2), horizon + 12 - h + r, w, 2);
      }
    }
    R(ctx, 0, horizon + 12, W, H, col.mid);
  }

  function drawWorld() {
    const halfW = W / 2 / Z + 80;
    const x0 = G.camX - halfW, x1 = G.camX + halfW, bottom = G.camY + H / Z;
    ctx.setTransform(Z, 0, 0, Z, W / 2 - G.camX * Z, H / 2 - G.camY * Z);

    for (const d of G.decor) if (d.x > x0 - 60 && d.x < x1 + 60 && d.shade) drawTree(ctx, d.x, G.groundY(d.x), d.s);

    // avlägg
    const xF = G.xF, gF = G.groundY(xF);
    R(ctx, xF - 3, gF - 90, xF + 3, gF + 4, C.t);
    R(ctx, xF - 48, gF - 112, xF + 48, gF - 84, C.wood);
    R(ctx, xF - 48, gF - 112, xF + 48, gF - 108, C.ring);
    ctx.fillStyle = "#26302c";
    ctx.font = "16px Silkscreen, 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Avlägg", xF, gF - 96);
    const px = xF + 140, gp = G.groundY(px);
    for (let r = 0; r < 4; r++) for (let i = 0; i < 4 - r; i++) {
      const cx = px + (i - (3 - r) / 2) * 20, cy = gp - 10 - r * 17;
      circle(ctx, cx, cy, 10, C.bark); circle(ctx, cx, cy, 8, C.wood); circle(ctx, cx, cy, 3, C.ring);
    }

    // mark
    ctx.beginPath();
    let first = true;
    for (const p of G.pts) {
      if (p.x < x0 - SEG || p.x > x1 + SEG) continue;
      if (first) { ctx.moveTo(p.x, bottom); first = false; }
      ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(x1 + SEG, bottom);
    ctx.closePath();
    ctx.fillStyle = col.dirt; ctx.fill();
    ctx.fillStyle = col.dirt2;
    for (let i = 0; i < G.pts.length; i++) {
      const p = G.pts[i];
      if (p.x < x0 || p.x > x1) continue;
      const h = (i * 2654435761) >>> 0;
      ctx.fillRect(p.x + (h % 40), p.y + 24 + (h % 70), 8, 6);
      ctx.fillRect(p.x + ((h >> 8) % 40), p.y + 60 + ((h >> 4) % 80), 6, 6);
    }
    ctx.beginPath(); first = true;
    for (const p of G.pts) {
      if (p.x < x0 - SEG || p.x > x1 + SEG) continue;
      if (first) { ctx.moveTo(p.x, p.y + 3); first = false; } else ctx.lineTo(p.x, p.y + 3);
    }
    ctx.strokeStyle = col.grass; ctx.lineWidth = 10; ctx.lineJoin = "round"; ctx.stroke();

    for (const b of G.bumps) {
      if (b.x < x0 || b.x > x1) continue;
      if (b.kind === "stump") {
        ctx.save(); ctx.translate(b.body.position.x, b.body.position.y); ctx.rotate(b.ang);
        R(ctx, -11, -8, 11, 8, C.t); R(ctx, -11, -8, 11, -4, C.wood);
        ctx.restore();
      } else {
        circle(ctx, b.body.position.x, b.body.position.y, 15, C.stone);
        circle(ctx, b.body.position.x - 4, b.body.position.y - 9, 4, C.stone2);
      }
    }

    // skotaren
    const m = MACHINES[machine], ch = G.chassis, bp = G.base.position;
    drawBogies(ctx, G.wheels.map(w => w.position));
    ctx.save(); ctx.translate(bp.x, bp.y); ctx.rotate(ch.angle);
    drawForwarder(ctx, m);
    ctx.restore();
    for (const l of G.logs) drawLog(ctx, l.position.x, l.position.y, l.angle);
    ctx.save(); ctx.translate(bp.x, bp.y); ctx.rotate(ch.angle);
    drawBoom(ctx, m);
    ctx.restore();
    for (const w of G.wheels) drawWheel(ctx, w.position.x, w.position.y, w.angle);

    for (const d of G.decor) if (d.x > x0 - 60 && d.x < x1 + 60 && !d.shade && Math.abs(d.x - bp.x) > 260) drawTree(ctx, d.x, G.groundY(d.x) + 14, d.s + 2);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function hudText(str, x, y, align = "left") {
    ctx.font = "8px Silkscreen, 'Courier New', monospace";
    ctx.textAlign = align; ctx.textBaseline = "top";
    ctx.fillStyle = col.night ? "rgba(0,0,0,0.5)" : "rgba(255,255,255,0.7)";
    ctx.fillText(str, x + 1, y + 1);
    ctx.fillStyle = col.ink;
    ctx.fillText(str, x, y);
  }
  function drawHud() {
    if (state === "menu") return;
    const load = state === "run" ? logsOnLoad() : G.delivered;
    hudText(`Bana ${level}`, 8, 7);
    hudText(`Last ${load}/${G.total}`, 8, 19);
    const left = Math.max(0, Math.round((G.xF - G.base.position.x) / 30));
    hudText(`${left} m kvar`, W - 8, 7, "right");
    hudText(fmtTime(G.time), W - 8, 19, "right");
    // förloppsmätare
    const prog = Math.max(0, Math.min(1, (G.base.position.x - 160) / (G.xF - 160)));
    R(ctx, W / 2 - 60, 9, W / 2 + 60, 13, "rgba(0,0,0,0.25)");
    R(ctx, W / 2 - 60, 9, W / 2 - 60 + 120 * prog, 13, MACHINES[machine].b);
  }

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (G && state !== "menu") {
      acc += dt * 1000;
      let n = 0;
      while (acc >= STEP && n < 5) { physicsStep(); acc -= STEP; n++; }
      if (n === 5) acc = 0;
      if (state === "done" || state === "fail") {
        doneT += dt;
        if (doneT > 0.9 && result.hidden) finish(state === "done");
      }
      const bp = G.base.position;
      const tx = bp.x + 120, ty = bp.y - 50;
      G.camX += (tx - G.camX) * Math.min(1, dt * 4);
      G.camY += (ty - G.camY) * Math.min(1, dt * 3);
      const rev = G.wheels.reduce((s, w) => s + Math.abs(w.angularVelocity), 0) / 4;
      engineSound(rev + (input.gas ? 0.08 : 0), state === "run");
    }
    if (G) { drawBackground(); drawWorld(); drawHud(); }
    requestAnimationFrame(loop);
  }

  // ---------- Meny ----------
  const lvLabel = document.getElementById("lvLabel");
  function updateLevelLabel() {
    const st = progress.stars[level] || 0;
    lvLabel.innerHTML = `Bana ${level} <span class="s">${"★".repeat(st)}${"☆".repeat(3 - st)}</span>`;
    document.getElementById("lvPrev").disabled = level <= 1;
    document.getElementById("lvNext").disabled = level >= progress.unlocked;
  }
  document.getElementById("lvPrev").addEventListener("click", () => { if (level > 1) { level--; G = buildLevel(level); updateLevelLabel(); } });
  document.getElementById("lvNext").addEventListener("click", () => { if (level < progress.unlocked) { level++; G = buildLevel(level); updateLevelLabel(); } });
  for (const p of picks) p.addEventListener("click", () => setMachine(p.dataset.m));
  document.getElementById("btnStart").addEventListener("click", () => { if (state === "menu") startLevel(); });
  document.getElementById("btnRetry").addEventListener("click", startLevel);
  document.getElementById("btnNext").addEventListener("click", () => { if (level < progress.unlocked) { level++; startLevel(); } });
  document.getElementById("btnMenu").addEventListener("click", showMenu);

  const btnSound = document.getElementById("btnSound");
  function updateSoundBtn() { btnSound.textContent = soundOn ? "Ljud: på" : "Ljud: av"; }
  btnSound.addEventListener("click", () => {
    soundOn = !soundOn; store.set("skotaren-ljud", soundOn); updateSoundBtn();
    if (!soundOn) engineSound(0, false); else ensureAudio();
  });
  updateSoundBtn();

  // ---------- Styrning ----------
  function bindHold(el, key) {
    const on = e => { e.preventDefault(); input[key] = true; el.classList.add("pressed"); ensureAudio(); };
    const off = () => { input[key] = false; el.classList.remove("pressed"); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  bindHold(document.getElementById("btnGas"), "gas");
  bindHold(document.getElementById("btnBrake"), "brake");

  // tryck på spelplanen: vänster halva bromsar, höger halva gasar
  const touches = new Map();
  function canvasInput() {
    let g = false, b = false;
    for (const side of touches.values()) side === "gas" ? (g = true) : (b = true);
    input.gas = g; input.brake = b;
  }
  cv.addEventListener("pointerdown", e => {
    if (state !== "run") return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    touches.set(e.pointerId, e.clientX - r.left > r.width / 2 ? "gas" : "brake");
    canvasInput();
  });
  const release = e => { if (touches.delete(e.pointerId)) canvasInput(); };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);
  cv.addEventListener("pointerleave", release);

  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    const onButton = e.target && e.target.tagName === "BUTTON";
    if (k === "arrowright" || k === "d") { e.preventDefault(); input.gas = true; ensureAudio(); }
    else if (k === "arrowleft" || k === "a") { e.preventDefault(); input.brake = true; }
    else if (k === "r" && state !== "menu") { startLevel(); }
    else if (k === "escape" && state !== "menu") { showMenu(); }
    else if ((k === "enter" || k === " ") && !onButton) {
      e.preventDefault();
      if (state === "menu") startLevel();
      else if (!result.hidden) startLevel();
    }
  });
  addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowright" || k === "d") input.gas = false;
    if (k === "arrowleft" || k === "a") input.brake = false;
  });
  addEventListener("blur", () => { input.gas = input.brake = false; touches.clear(); });
  document.addEventListener("visibilitychange", () => { last = performance.now(); acc = 0; });

  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors); } catch (e) {}
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreviews);

  readColors();
  setMachine(machine);
  G = buildLevel(level);
  updateLevelLabel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
